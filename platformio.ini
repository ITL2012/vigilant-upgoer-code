; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.mcu = esp32s3
board_build.variant = esp32s3
board_build.flash_mode = qio
board_build.flash_size = 16MB

build_flags =
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_USE_MALLOC=1

; Exclude the pyro test bench from the flight build
build_src_filter = +<*> -<pyrotest/*>

lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
    adafruit/Adafruit BNO08x @ ^1.2.5
    adafruit/Adafruit BMP5xx Library @ ^1.0.2
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.1
    dlloydev/QuickPID @ ^3.1.9
    ayushsharma82/ElegantOTA

; ============================================================================
; PYRO TEST BENCH — standalone igniter / pyro channel tester
; Build:  pio run -e pyrotest          Upload: pio run -e pyrotest -t upload
; Web UI: http://192.168.4.1/  (firmware OTA on http://192.168.4.1:81/update)
; Uses the SAME pyro pins as the flight program (src/globals.h) but lets you
; override pin + pulse length per channel from the UI (persisted to NVS).
; Safe arming: two-step arm with code, auto-disarm timer, fires refused while
; disarmed.
; ============================================================================
[env:pyrotest]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.mcu = esp32s3
board_build.variant = esp32s3
board_build.flash_mode = qio
board_build.flash_size = 16MB

build_flags =
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_USE_MALLOC=1

; Only compile src/pyrotest/ (flight code is excluded)
build_src_filter = -<*> +<pyrotest/*>

lib_deps = ${env:esp32-s3-devkitc-1.lib_deps}

